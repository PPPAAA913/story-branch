<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Story Branch</title><link rel="stylesheet" href="/static/workspace.css"></head>
<body>
<header><a class="brand" href="/">✦ <span>Story Branch<small>小组创作工作台</small></span></a></header>
<main style="max-width:440px;margin:8vh auto;padding:24px">
<div class="eyebrow">CREATE A STORY TOGETHER</div><h1>继续我们的故事。</h1>
<p class="muted">使用小组账号登录，共同推敲故事，保留每一次选择。</p>
<form id="login-form"><label>账号<input id="username" autocomplete="username" maxlength="80" required></label><label>密码<input id="password" type="password" autocomplete="current-password" maxlength="128" required></label><p id="error" role="alert"></p><button class="primary" id="submit">登录工作台 →</button></form>
<p class="muted small">账号由项目管理员提供。首次运行需在服务器执行账号初始化。</p>
</main><script src="/static/login.js"></script></body></html>
